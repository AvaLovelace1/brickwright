[project]
name = "bricklayer-sdk"
version = "0.1.0"
description = "An SDK for programmatically creating and validating LEGO® builds."
readme = "README.md"
license = "MIT AND CC-BY-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "BrickWright Authors" }]
keywords = ["lego", "ldraw", "cad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "bm25s",
    "dracopy",
    "numpy",
    "pydantic",
    "python-fcl",
]

[project.urls]
Homepage = "https://avalovelace1.github.io/brickwright/"
Repository = "https://github.com/AvaLovelace1/brickwright"

[project.scripts]
extract-part-data = "bricklayer.ldraw.scripts.run_all:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bricklayer"

[dependency-groups]
dev = [
    "mutmut",
    "pytest",
    "pytest-cov",
    "pytest-regressions",
    "ruff",
    "ty",
    "usd-core",
]

[tool.mutmut]
source_paths = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "--import-mode=importlib"
markers = [
    "integration: potentially long-running tests",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# `exec` is how the docs' snippets are run to prove they work (S102).
"tests/**" = ["S102"]


[tool.ty.environment]
python = "../../.venv" # point ty to the shared venv
