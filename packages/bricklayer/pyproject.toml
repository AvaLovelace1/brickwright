[project]
name = "bricklayer"
version = "0.1.0"
description = "An SDK for programmatically creating and validating LEGO® builds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bm25s",
    "dracopy",
    "numpy",
    "pydantic",
    "python-fcl",
]

[project.scripts]
extract-part-data = "bricklayer.ldraw.scripts.run_all:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut",
    "pytest",
    "pytest-cov",
    "pytest-regressions",
    "ruff",
    "ty",
    "usd-core",
]

[tool.mutmut]
source_paths = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "--import-mode=importlib"
markers = [
    "integration: potentially long-running tests",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# `exec` is how the docs' snippets are run to prove they work (S102).
"tests/**" = ["S102"]


[tool.ty.environment]
python = "../../.venv" # point ty to the shared venv
