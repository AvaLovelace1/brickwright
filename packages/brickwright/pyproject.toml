[project]
name = "brickwright"
version = "0.1.0"
description = "Agentic LEGO® build generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bricklayer",
    "gltflib",
    "ldraw2mesh",
    "litellm",
    "numpy",
    "pillow",
    "pydantic",
    "pygfx",
    "rendercanvas",
    "rich",
    "typer",
]

[tool.uv.sources]
bricklayer = { workspace = true }

[project.scripts]
brickwright = "brickwright.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut",
    "pytest",
    "pytest-cov",
    "pytest-regressions",
    "ruff",
    "ty",
]

[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = ["*/_build_template.py"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "integration: drives the full agent loop (run_agent), the CLI, or a real subprocess",
    "real_agent: runs a real AI agent with an API key",
]
filterwarnings = [
    "ignore::DeprecationWarning:pygfx",
]

[tool.ruff]
# Test assets are captured, generated build.py files (fixtures) -- not project code.
extend-exclude = ["tests/assets"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# tools must never propagate errors, hence general exception catch (BLE001).
# `exec` is how tools run agent snippets (S102).
"src/brickwright/tools/*.py" = ["BLE001", "S102"]
"tests/**" = ["S102"]  # tests exec the generated model template

[tool.ty.environment]
python = "../../.venv" # point ty to the shared venv
