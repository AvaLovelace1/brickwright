name: Release
on:
  push:
    tags: [ "v*" ]
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: uv build --all-packages --no-sources
      - name: Smoke test
        run: |
          uv venv --python 3.11 smoke
          uv pip install --python smoke/bin/python dist/*.whl
          smoke/bin/brickwright --help
          smoke/bin/python -c "
          import bricklayer as bl
          model = bl.LegoBuild()
          base = model.add(bl.plate(4, 4, color=bl.Color.GREEN), (0, 0, 0), name='base')
          model.stack(bl.brick(2, 2, color=bl.Color.RED), on=base)
          assert model.is_valid()
          "
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish-bricklayer-sdk:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-bricklayer-sdk
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish dist/bricklayer_sdk-*
  publish-brickwright:
    needs: publish-bricklayer-sdk
    runs-on: ubuntu-latest
    environment: pypi-brickwright
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish dist/brickwright-*
