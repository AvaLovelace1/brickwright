repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [ python, pyi ]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [ python, pyi ]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [ python, pyi ]
        pass_filenames: false
      - id: pytest
        name: pytest (not integration)
        entry: uv run pytest -m "not integration"
        language: system
        types_or: [ python, pyi ]
        pass_filenames: false
